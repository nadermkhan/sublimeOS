[build]
target = "x86_64-unknown-linux-none"

[target.x86_64-unknown-linux-none]
rustflags = [
    "-C", "link-arg=-Tuser.ld",
    "-C", "relocation-model=static",
    "-C", "link-arg=-z", "-C", "link-arg=max-page-size=0x1000",
]

[unstable]
build-std = ["core", "alloc", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]
